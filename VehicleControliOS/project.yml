name: VehicleControl
options:
  bundleIdPrefix: com.vehiclecontrol
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  VehicleControl:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: VehicleControl/Info.plist
      properties:
        CFBundleDisplayName: 车控
        CFBundleShortVersionString: "1.4.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.vehiclecontrol.app.oauth
            CFBundleURLSchemes:
              - com.vehiclecontrol.app
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.vehiclecontrol.app.refresh
        # 仅放行本地网络（127.0.0.1 / .local），正式环境仍强制 HTTPS。
        # 联调 Tools/mock-server 需要它；上线前可删除。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vehiclecontrol.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  VehicleControl:
    build:
      targets:
        VehicleControl: all
    run:
      config: Debug
    archive:
      config: Release
